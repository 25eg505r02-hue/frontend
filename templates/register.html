<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${t['register']} + ' - ' + ${t['brand']})}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar('register')}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card shadow border-0 overflow-hidden">
                        <div class="card-header bg-forest text-white py-4 text-center">
                            <div class="brand-icon mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.8rem;">
                                <i class="fa-solid fa-leaf text-warning"></i>
                            </div>
                            <h4 class="fw-bold mb-1" th:text="${t['brand']}">SmartAgri AI</h4>
                            <p class="small text-white-50 mb-0">Farmer Registration Portal</p>
                        </div>
                        <div class="card-body p-4 p-md-5">
                            <h5 class="fw-bold mb-3 text-secondary text-center" th:text="${t['register']}">Create Account</h5>
                            <form method="POST" th:action="@{/register}">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Farmer Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                        <input type="text" name="name" class="form-control" placeholder="e.g. Ramesh Patel" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                                        <input type="email" name="email" class="form-control" placeholder="farmer@agri.com" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                        <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label small fw-semibold">Phone Number</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                                            <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210">
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label small fw-semibold">Location / District</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="fa-solid fa-location-dot text-muted"></i></span>
                                            <input type="text" name="location" class="form-control" placeholder="e.g. Warangal, Telangana">
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-agri w-100 py-2 fs-6 shadow-sm mt-2">
                                    <i class="fa-solid fa-user-plus me-2"></i> <span th:text="${t['register']}">Register Account</span>
                                </button>
                            </form>
                            <div class="mt-4 text-center small text-muted">
                                Already registered? <a th:href="@{/login}" class="fw-bold text-success" th:text="${t['login']}">Login here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
