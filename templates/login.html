<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${t['login']} + ' - ' + ${t['brand']})}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar('login')}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow border-0 overflow-hidden">
                        <div class="card-header bg-forest text-white py-4 text-center">
                            <div class="brand-icon mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.8rem;">
                                <i class="fa-solid fa-leaf text-warning"></i>
                            </div>
                            <h4 class="fw-bold mb-1" th:text="${t['brand']}">SmartAgri AI</h4>
                            <p class="small text-white-50 mb-0" th:text="${t['title']}">Smart Irrigation & Crop Recommendation</p>
                        </div>
                        <div class="card-body p-4 p-md-5">
                            <h5 class="fw-bold mb-3 text-secondary text-center" th:text="${t['login']}">Login</h5>
                            <form method="POST" th:action="@{/login}">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                                        <input type="email" name="email" class="form-control" value="ramesh@agri.com" placeholder="farmer@example.com" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-semibold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                        <input type="password" name="password" class="form-control" value="password123" placeholder="Enter password" required>
                                    </div>
                                    <div class="form-text small mt-2">
                                        Demo credentials: <code>ramesh@agri.com</code> / <code>password123</code>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-agri w-100 py-2 fs-6 shadow-sm">
                                    <i class="fa-solid fa-right-to-bracket me-2"></i> <span th:text="${t['login']}">Login</span>
                                </button>
                            </form>
                            <div class="mt-4 text-center small text-muted">
                                Don't have an account yet? <a th:href="@{/register}" class="fw-bold text-success" th:text="${t['register']}">Register</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
